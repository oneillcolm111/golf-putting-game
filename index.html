<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Putt Course</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #12161b;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    color: #eaf6ff;
    user-select: none;
    padding: 0 10px 16px;
  }
  h1 { margin: 14px 0 4px; letter-spacing: 1px; font-size: clamp(20px, 6vw, 28px); }
  #hud {
    display: flex;
    gap: 18px;
    font-size: 16px;
    margin-bottom: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #hud span { font-weight: bold; color: #ffd76e; }
  #hint {
    font-size: 13px;
    opacity: 0.75;
    margin-bottom: 8px;
    text-align: center;
    max-width: 520px;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }
  canvas {
    background: linear-gradient(#8fd4f0 0%, #bfe8f7 32%, #3a9d4f 32%, #2f8a44 70%, #256e37 100%);
    border: 4px solid #123b1f;
    border-radius: 8px;
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 20, 12, 0.72);
    border-radius: 8px;
    text-align: center;
    padding: 16px;
  }
  #overlay.show { display: flex; }
  #overlayCard h2 { margin: 0 0 6px; font-size: clamp(18px, 5vw, 24px); }
  #overlayCard p { margin: 4px 0; font-size: 15px; }
  #overlayCard .result-good { color: #7dffb0; }
  #overlayCard .result-bad { color: #ff8f7d; }
  #overlayCard table {
    margin: 10px auto;
    border-collapse: collapse;
    font-size: 14px;
  }
  #overlayCard td, #overlayCard th {
    padding: 3px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  button.gameBtn {
    margin-top: 10px;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    background: #ffd76e;
    color: #12161b;
    cursor: pointer;
  }
  button.gameBtn:active { transform: scale(0.97); }
  #resetBtn {
    margin-top: 10px;
    padding: 6px 16px;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    background: transparent;
    color: #eaf6ff;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>⛳ Putt Course</h1>
  <div id="hud">
    <div>Hole <span id="holeNum">1</span>/9</div>
    <div>Par <span id="holePar">2</span></div>
    <div>Strokes <span id="holeStrokes">0</span></div>
    <div>Total <span id="totalStrokes">0</span></div>
  </div>
  <div id="hint">Drag back from the ball to aim, release to putt. Watch the arrows &mdash; they show which way the green breaks.</div>
  <div id="gameWrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="overlay">
      <div id="overlayCard"></div>
    </div>
  </div>
  <button id="resetBtn">Reset Ball</button>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayCard = document.getElementById('overlayCard');
  const holeNumEl = document.getElementById('holeNum');
  const holeParEl = document.getElementById('holePar');
  const holeStrokesEl = document.getElementById('holeStrokes');
  const totalStrokesEl = document.getElementById('totalStrokes');
  const resetBtn = document.getElementById('resetBtn');

  const W = canvas.width, H = canvas.height;
  const CENTER_X = W / 2;
  const HORIZON_Y = H * 0.17;
  const BASE_Y = H * 0.94;
  const PERSP_K = 0.05;
  const PX_PER_UNIT = 62;

  function scaleAt(z) { return 1 / (1 + z * PERSP_K); }
  function screenY(z) {
    const f = scaleAt(z);
    return BASE_Y - (BASE_Y - HORIZON_Y) * (1 - f);
  }
  function screenX(x, z) { return CENTER_X + x * scaleAt(z) * PX_PER_UNIT; }
  function project(x, z) { return { sx: screenX(x, z), sy: screenY(z), s: scaleAt(z) }; }

  // ---- Hole definitions ----
  const HOLES = [
    { par: 2, length: 13, width: 6, slope: { type: 'flat' },
      hazards: [] },
    { par: 2, length: 16, width: 6, slope: { type: 'tilt', ax: 0.55 },
      hazards: [] },
    { par: 3, length: 19, width: 7, slope: { type: 'valley', k: 0.16 },
      hazards: [{ type: 'sand', xMin: 1.2, xMax: 3.3, zMin: 8, zMax: 12 }] },
    { par: 3, length: 21, width: 7, slope: { type: 'flat' },
      hazards: [{ type: 'water', xMin: -3.5, xMax: 1.0, zMin: 10, zMax: 13 }] },
    { par: 3, length: 22, width: 8, slope: { type: 'ridge', k: 0.20 },
      hazards: [] },
    { par: 3, length: 20, width: 7, slope: { type: 'tilt', ax: -0.35 },
      hazards: [{ type: 'sand', xMin: -1.8, xMax: 1.8, zMin: 9, zMax: 13 }] },
    { par: 4, length: 28, width: 8, slope: { type: 'scurve', k: 0.55, freq: 0.28 },
      hazards: [] },
    { par: 3, length: 18, width: 5, slope: { type: 'flat' },
      hazards: [
        { type: 'water', xMin: -4.5, xMax: -1.6, zMin: 0, zMax: 18 },
        { type: 'water', xMin: 1.6, xMax: 4.5, zMin: 0, zMax: 18 }
      ] },
    { par: 4, length: 24, width: 9, slope: { type: 'valley', k: 0.10 },
      hazards: [{ type: 'water', ring: true, cx: 0, cz: 24, safeRadius: 2.6, xMin: -4.5, xMax: 4.5, zMin: 18, zMax: 26 }] }
  ];

  const HOLE_RADIUS = 0.45;
  const BALL_RADIUS = 0.16;
  const FRICTION = 1.35;
  const FRICTION_SAND = 4.6;
  const MAX_SPEED = 13.5;
  const MAX_DRAG_PX = 130;
  const STOP_SPEED = 0.12;

  let state = {
    holeIndex: 0,
    strokes: 0,
    total: 0,
    scorecard: [],
    ball: { x: 0, z: 0.4, vx: 0, vz: 0, resting: true },
    lastRest: { x: 0, z: 0.4 },
    aiming: false,
    dragCurrent: { x: 0, y: 0 },
    holedOut: false,
    message: null
  };

  function currentHole() { return HOLES[state.holeIndex]; }

  function setupHole(idx) {
    const h = HOLES[idx];
    state.ball = { x: 0, z: 0.4, vx: 0, vz: 0, resting: true };
    state.lastRest = { x: 0, z: 0.4 };
    state.strokes = 0;
    state.holedOut = false;
    state.message = null;
    holeNumEl.textContent = idx + 1;
    holeParEl.textContent = h.par;
    holeStrokesEl.textContent = 0;
    overlay.classList.remove('show');
  }

  function getSlopeAccel(x, z, hole) {
    const s = hole.slope;
    switch (s.type) {
      case 'tilt': return { ax: s.ax, az: 0 };
      case 'valley': return { ax: -s.k * x, az: 0 };
      case 'ridge': return { ax: s.k * x, az: 0 };
      case 'scurve': return { ax: Math.sin(z * s.freq) * s.k, az: 0 };
      default: return { ax: 0, az: 0 };
    }
  }

  function isInRect(x, z, hz) {
    return x >= hz.xMin && x <= hz.xMax && z >= hz.zMin && z <= hz.zMax;
  }

  function hazardAt(x, z, hole) {
    for (const hz of hole.hazards) {
      if (hz.ring) {
        if (isInRect(x, z, hz)) {
          const d = Math.hypot(x - hz.cx, z - hz.cz);
          if (d > hz.safeRadius) return hz;
        }
      } else if (isInRect(x, z, hz)) {
        return hz;
      }
    }
    return null;
  }

  function startPutt(dirX, dirZ, power) {
    const speed = power * MAX_SPEED;
    state.ball.vx = dirX * speed;
    state.ball.vz = dirZ * speed;
    state.ball.resting = false;
    state.strokes++;
    holeStrokesEl.textContent = state.strokes;
  }

  function applyPenalty(kind) {
    state.strokes++;
    holeStrokesEl.textContent = state.strokes;
    state.ball.x = state.lastRest.x;
    state.ball.z = state.lastRest.z;
    state.ball.vx = 0;
    state.ball.vz = 0;
    state.ball.resting = true;
    state.message = kind === 'water' ? 'Splash! +1 penalty' : 'Out of bounds! +1 penalty';
    state.flashUntil = performance.now() + 1100;
  }

  function finishHole() {
    state.holedOut = true;
    const h = currentHole();
    state.total += state.strokes;
    state.scorecard.push({ hole: state.holeIndex + 1, par: h.par, strokes: state.strokes });
    totalStrokesEl.textContent = state.total;
    showHoleOverlay();
  }

  function showHoleOverlay() {
    const h = currentHole();
    const diff = state.strokes - h.par;
    const label = diff <= -2 ? 'Eagle!' : diff === -1 ? 'Birdie!' : diff === 0 ? 'Par' : diff === 1 ? 'Bogey' : `+${diff}`;
    const cls = diff <= 0 ? 'result-good' : 'result-bad';
    const isLast = state.holeIndex === HOLES.length - 1;
    overlayCard.innerHTML = `
      <h2>Hole ${state.holeIndex + 1} complete</h2>
      <p class="${cls}">${state.strokes} strokes &middot; ${label}</p>
      <p>Total so far: ${state.total}</p>
      <button class="gameBtn" id="nextBtn">${isLast ? 'See Scorecard' : 'Next Hole →'}</button>
    `;
    overlay.classList.add('show');
    document.getElementById('nextBtn').onclick = () => {
      if (isLast) {
        showFinalScorecard();
      } else {
        state.holeIndex++;
        setupHole(state.holeIndex);
      }
    };
  }

  function showFinalScorecard() {
    let rows = state.scorecard.map(r => {
      const d = r.strokes - r.par;
      const dLabel = d === 0 ? 'E' : d > 0 ? `+${d}` : `${d}`;
      return `<tr><td>${r.hole}</td><td>${r.par}</td><td>${r.strokes}</td><td>${dLabel}</td></tr>`;
    }).join('');
    const totalPar = HOLES.reduce((a, h) => a + h.par, 0);
    const diff = state.total - totalPar;
    const diffLabel = diff === 0 ? 'Even' : diff > 0 ? `+${diff}` : `${diff}`;
    overlayCard.innerHTML = `
      <h2>Round Complete</h2>
      <table>
        <tr><th>Hole</th><th>Par</th><th>Strokes</th><th>+/-</th></tr>
        ${rows}
        <tr><td><b>Tot</b></td><td><b>${totalPar}</b></td><td><b>${state.total}</b></td><td><b>${diffLabel}</b></td></tr>
      </table>
      <button class="gameBtn" id="restartBtn">Play Again</button>
    `;
    overlay.classList.add('show');
    document.getElementById('restartBtn').onclick = () => {
      state.holeIndex = 0;
      state.total = 0;
      state.scorecard = [];
      totalStrokesEl.textContent = 0;
      setupHole(0);
    };
  }

  // ---- Input (mouse + touch via Pointer Events) ----
  let dragStart = null;

  function pointerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const sx = (evt.clientX - rect.left) * (W / rect.width);
    const sy = (evt.clientY - rect.top) * (H / rect.height);
    return { x: sx, y: sy };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.ball.resting || state.holedOut || overlay.classList.contains('show')) return;
    const p = pointerPos(e);
    dragStart = p;
    state.aiming = true;
    state.dragCurrent = p;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.aiming) return;
    state.dragCurrent = pointerPos(e);
  });

  function endAim() {
    if (!state.aiming) return;
    state.aiming = false;
    const dx = state.dragCurrent.x - dragStart.x;
    const dy = state.dragCurrent.y - dragStart.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 10) { dragStart = null; return; }
    const power = Math.min(dist, MAX_DRAG_PX) / MAX_DRAG_PX;
    const shotX = -dx;
    const shotZ = dy; // screen "up" (negative dy) => world forward (+z)
    const len = Math.hypot(shotX, shotZ) || 1;
    startPutt(shotX / len, shotZ / len, power);
    dragStart = null;
  }

  canvas.addEventListener('pointerup', endAim);
  canvas.addEventListener('pointercancel', endAim);

  resetBtn.addEventListener('click', () => {
    state.ball.x = state.lastRest.x;
    state.ball.z = state.lastRest.z;
    state.ball.vx = 0;
    state.ball.vz = 0;
    state.ball.resting = true;
    state.aiming = false;
  });

  // ---- Physics ----
  function update(dt) {
    const ball = state.ball;
    if (ball.resting || state.holedOut) return;
    const hole = currentHole();
    const inSand = hazardAt(ball.x, ball.z, hole) && hazardAt(ball.x, ball.z, hole).type === 'sand';
    const friction = inSand ? FRICTION_SAND : FRICTION;

    const { ax, az } = getSlopeAccel(ball.x, ball.z, hole);
    ball.vx += ax * dt;
    ball.vz += az * dt;

    const speed = Math.hypot(ball.vx, ball.vz);
    if (speed > 0) {
      const dec = friction * dt;
      const newSpeed = Math.max(0, speed - dec);
      const ratio = newSpeed / speed;
      ball.vx *= ratio;
      ball.vz *= ratio;
    }

    ball.x += ball.vx * dt;
    ball.z += ball.vz * dt;

    // side wall bounce
    const halfW = hole.width / 2;
    if (ball.x < -halfW) { ball.x = -halfW; ball.vx *= -0.55; }
    if (ball.x > halfW) { ball.x = halfW; ball.vx *= -0.55; }
    // back of tee bounce
    if (ball.z < 0.15) { ball.z = 0.15; ball.vz *= -0.5; }
    // overshoot past green end
    if (ball.z > hole.length + 1.5) { ball.z = hole.length + 1.5; ball.vz *= -0.4; }

    const distToHole = Math.hypot(ball.x - 0, ball.z - hole.length);
    const curSpeed = Math.hypot(ball.vx, ball.vz);

    if (distToHole < HOLE_RADIUS && curSpeed < 6.5) {
      finishHole();
      return;
    }

    const hz = hazardAt(ball.x, ball.z, hole);
    if (hz && hz.type === 'water') {
      applyPenalty('water');
      return;
    }

    if (curSpeed < STOP_SPEED) {
      ball.vx = 0;
      ball.vz = 0;
      ball.resting = true;
      state.lastRest = { x: ball.x, z: ball.z };
    }
  }

  // ---- Rendering ----
  function drawFairway(hole) {
    const halfW = hole.width / 2;
    const near = project(-halfW, 0), nearR = project(halfW, 0);
    const far = project(-halfW, hole.length), farR = project(halfW, hole.length);
    ctx.fillStyle = '#2f8a44';
    ctx.beginPath();
    ctx.moveTo(near.sx, near.sy);
    ctx.lineTo(nearR.sx, nearR.sy);
    ctx.lineTo(farR.sx, farR.sy);
    ctx.lineTo(far.sx, far.sy);
    ctx.closePath();
    ctx.fill();

    // stripes for depth cue
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let z = 2; z < hole.length; z += 2) {
      const l = project(-halfW, z), r = project(halfW, z);
      ctx.beginPath();
      ctx.moveTo(l.sx, l.sy);
      ctx.lineTo(r.sx, r.sy);
      ctx.stroke();
    }
  }

  function drawHazards(hole) {
    for (const hz of hole.hazards) {
      ctx.fillStyle = hz.type === 'water' ? 'rgba(52,120,210,0.85)' : 'rgba(214,188,120,0.9)';
      if (hz.ring) {
        // draw rect then punch a lighter circle for the safe area (visual approx)
        drawRectHazard(hz);
        const c = project(hz.cx, hz.cz);
        ctx.beginPath();
        ctx.fillStyle = '#2f8a44';
        ctx.ellipse(c.sx, c.sy, hz.safeRadius * c.s * PX_PER_UNIT, hz.safeRadius * c.s * PX_PER_UNIT * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = hz.type === 'water' ? 'rgba(52,120,210,0.85)' : 'rgba(214,188,120,0.9)';
        drawRectHazard(hz);
      }
    }
  }

  function drawRectHazard(hz) {
    const p1 = project(hz.xMin, hz.zMin), p2 = project(hz.xMax, hz.zMin);
    const p3 = project(hz.xMax, hz.zMax), p4 = project(hz.xMin, hz.zMax);
    ctx.beginPath();
    ctx.moveTo(p1.sx, p1.sy);
    ctx.lineTo(p2.sx, p2.sy);
    ctx.lineTo(p3.sx, p3.sy);
    ctx.lineTo(p4.sx, p4.sy);
    ctx.closePath();
    ctx.fill();
  }

  function drawBreakArrows(hole) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    for (let z = 3; z < hole.length; z += 4) {
      for (let x = -hole.width / 2 + 1; x <= hole.width / 2 - 1; x += 2) {
        const { ax } = getSlopeAccel(x, z, hole);
        if (Math.abs(ax) < 0.03) continue;
        const p = project(x, z);
        const dirLen = 10 * p.s;
        const dx = Math.sign(ax) * dirLen;
        ctx.beginPath();
        ctx.moveTo(p.sx - dx, p.sy);
        ctx.lineTo(p.sx + dx, p.sy);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.sx + dx, p.sy);
        ctx.lineTo(p.sx + dx - Math.sign(ax) * 5 * p.s, p.sy - 4 * p.s);
        ctx.lineTo(p.sx + dx - Math.sign(ax) * 5 * p.s, p.sy + 4 * p.s);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  function drawHole(hole) {
    const p = project(0, hole.length);
    const r = Math.max(3, HOLE_RADIUS * p.s * PX_PER_UNIT);
    ctx.fillStyle = '#0c1a0e';
    ctx.beginPath();
    ctx.ellipse(p.sx, p.sy, r, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // flag
    ctx.strokeStyle = '#e8e8e8';
    ctx.lineWidth = Math.max(1, 2 * p.s);
    ctx.beginPath();
    ctx.moveTo(p.sx, p.sy);
    ctx.lineTo(p.sx, p.sy - 42 * p.s);
    ctx.stroke();
    ctx.fillStyle = '#ff5757';
    ctx.beginPath();
    ctx.moveTo(p.sx, p.sy - 42 * p.s);
    ctx.lineTo(p.sx + 16 * p.s, p.sy - 36 * p.s);
    ctx.lineTo(p.sx, p.sy - 30 * p.s);
    ctx.closePath();
    ctx.fill();
  }

  function drawBall() {
    const p = project(state.ball.x, state.ball.z);
    const r = Math.max(2.5, BALL_RADIUS * p.s * PX_PER_UNIT);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawAim() {
    if (!state.aiming) return;
    const p = project(state.ball.x, state.ball.z);
    const dx = state.dragCurrent.x - dragStart.x;
    const dy = state.dragCurrent.y - dragStart.y;
    const dist = Math.min(Math.hypot(dx, dy), MAX_DRAG_PX);
    const ang = Math.atan2(dy, dx);
    const aimLen = dist * 1.8;
    const ex = p.sx - Math.cos(ang) * aimLen;
    const ey = p.sy - Math.sin(ang) * aimLen;

    const power = dist / MAX_DRAG_PX;
    ctx.strokeStyle = power > 0.75 ? '#ff5757' : power > 0.4 ? '#ffd76e' : '#7dffb0';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(p.sx, p.sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);

    // power meter
    const meterX = 18, meterY = H - 30, meterW = 120, meterH = 12;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(meterX, meterY, meterW, meterH);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillRect(meterX, meterY, meterW * power, meterH);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(meterX, meterY, meterW, meterH);
  }

  function drawMessage() {
    if (state.message && state.flashUntil && performance.now() < state.flashUntil) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Trebuchet MS, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.message, CENTER_X, H * 0.4);
    } else {
      state.message = null;
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    const hole = currentHole();
    drawFairway(hole);
    drawHazards(hole);
    drawBreakArrows(hole);
    drawHole(hole);
    drawBall();
    drawAim();
    drawMessage();
  }

  let lastT = null;
  function loop(t) {
    if (lastT === null) lastT = t;
    const dt = Math.min(0.033, (t - lastT) / 1000);
    lastT = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  setupHole(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
